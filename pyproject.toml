# pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swb2_stats"
version = "0.1.0"
description = "Zonal statistics and summary exports for SWB2 netCDF outputs (netCDF/TIF)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0" }  # keep or change to your preferred license
authors = [
  { name = "Stephen M. Westenbroek" }  # email optional
]
keywords = ["SWB2", "hydrology", "xarray", "netcdf", "raster", "zonal statistics"]

dependencies = [
  "xarray>=2023.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "rioxarray>=0.15",
  "rasterio>=1.3",
  "xrspatial>=0.3",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "sphinx>=7.2",
  "furo>=2024.0.0",     # optional: Sphinx theme
  "myst-parser>=2.0",   # optional: Markdown in Sphinx
  "ruff>=0.3",          # optional: linter
  "black>=24.1",        # optional: formatter
]

[project.urls]
Repository = "https://github.com/smwesten-usgs/swb2_stats"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["swb2_stats*"]

# Console script entry point for later (will work after we add cli.py)
[project.scripts]
swb2_stats = "swb2_stats.cli:main"